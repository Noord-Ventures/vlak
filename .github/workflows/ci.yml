name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw

jobs:
  check:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages and site)
        run: pnpm typecheck && pnpm --filter www typecheck
      - name: Lint
        run: pnpm lint
      - name: Build packages
        run: pnpm build
      - name: Generated files are committed and current
        run: |
          git status --porcelain -- packages/core/css packages/core/tokens packages/core/props registry
          git diff --exit-code -- packages/core/css packages/core/tokens packages/core/props registry \
            || { echo "::error::Generated files are stale. Run pnpm build and commit packages/core/css, tokens, props, and registry/."; exit 1; }
      - name: Unit and integrity tests
        run: pnpm test
      - name: Size budget
        run: pnpm size
      - name: Consumer smoke test (tarballs, publint, types)
        run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: |
            packages/core/dist
            packages/core/css/vlak.css
            packages/react/dist
            packages/cli/dist
          retention-days: 7

  site:
    name: Docs site build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: .pw
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter www exec playwright install chromium --with-deps
      - name: Every catalogue entry has an isolated example
        run: node apps/www/scripts/check-examples.mjs
      - name: Site state and planning integrity
        run: node --test apps/www/scripts/analytics.test.mjs apps/www/scripts/test-inspiration-dynamics.mjs apps/www/scripts/microscopy-plan.test.mjs apps/www/scripts/desktop-os.test.mjs apps/www/scripts/calendar-model.test.mjs
      - name: Build the site
        run: pnpm --filter www build
      - name: Canonical pages, sharing metadata, sitemap and agent links
        run: node apps/www/scripts/check-discovery.mjs
      - name: Agent plugin, MCP and model-readable docs
        run: pnpm check:agents
      - name: Mobile navigation and interactive workspaces
        run: |
          python3 -m http.server 3016 --directory apps/www/out > /tmp/vlak-interface-server.log 2>&1 &
          INTERFACE_SERVER_PID=$!
          trap 'kill "$INTERFACE_SERVER_PID"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:3016/interfaces/ > /dev/null
          SITE_URL=http://localhost:3016 node apps/www/scripts/mobile-navigation-e2e.mjs
          INTERFACES=drive,documentation,video-player,desktop-os,calendar SITE_URL=http://localhost:3016 node apps/www/scripts/e2e-interface-refresh.mjs
          SITE_URL=http://localhost:3016 node apps/www/scripts/interface-preview-e2e.mjs
      - name: axe, keyboard, and phone checks over the export
        run: pnpm --filter www e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: apps/www/out
          retention-days: 7
