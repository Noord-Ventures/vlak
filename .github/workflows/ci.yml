name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw

jobs:
  check:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages and site)
        run: pnpm typecheck && pnpm --filter www typecheck
      - name: Lint
        run: pnpm lint
      - name: Build packages
        run: pnpm build
      - name: Reference app route types, typecheck, and server tests
        env:
          AI_REFERENCE_MODE: fixture
          OPENAI_API_KEY: ""
        run: |
          pnpm --filter @noorddev/vlak-assistant-reference typecheck
          pnpm --filter @noorddev/vlak-assistant-reference test
      - name: Generated files are committed and current
        run: |
          git status --porcelain -- packages/core/css packages/core/tokens packages/core/props registry
          git diff --exit-code -- packages/core/css packages/core/tokens packages/core/props registry \
            || { echo "::error::Generated files are stale. Run pnpm build and commit packages/core/css, tokens, props, and registry/."; exit 1; }
      - name: Unit and integrity tests
        run: pnpm test
      - name: Size budget
        run: pnpm size
      - name: Consumer smoke test (tarballs, publint, types)
        run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: |
            packages/core/dist
            packages/core/css/vlak.css
            packages/react/dist
            packages/cli/dist
          retention-days: 7

  site:
    name: Docs site build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: .pw
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter www exec playwright install chromium --with-deps
      - name: Every catalogue entry has an isolated example
        run: node apps/www/scripts/check-examples.mjs
      - name: Site state and planning integrity
        run: node --test apps/www/scripts/analytics.test.mjs apps/www/scripts/test-inspiration-dynamics.mjs apps/www/scripts/microscopy-plan.test.mjs apps/www/scripts/desktop-os.test.mjs apps/www/scripts/calendar-model.test.mjs apps/www/scripts/serve-export.test.mjs
      - name: Build the site
        run: pnpm --filter www build
      - name: AI demo and global search behavior
        run: pnpm --filter www test
      - name: Build the reference app
        env:
          AI_REFERENCE_MODE: fixture
          OPENAI_API_KEY: ""
        run: pnpm --filter @noorddev/vlak-assistant-reference build
      - name: Canonical pages, sharing metadata, sitemap and agent links
        run: node apps/www/scripts/check-discovery.mjs
      - name: Agent plugin, MCP and model-readable docs
        run: pnpm check:agents
      - name: Mobile navigation and interactive workspaces
        run: |
          node apps/www/scripts/serve-export.mjs --port 3016 > /tmp/vlak-interface-server.log 2>&1 &
          INTERFACE_SERVER_PID=$!
          trap 'kill "$INTERFACE_SERVER_PID"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:3016/interfaces/ > /dev/null
          SITE_URL=http://localhost:3016 node apps/www/scripts/mobile-navigation-e2e.mjs
          SITE_URL=http://localhost:3016 node apps/www/scripts/site-search-e2e.mjs
          INTERFACES=drive,documentation,video-player,desktop-os,calendar,android,ios SITE_URL=http://localhost:3016 node apps/www/scripts/e2e-interface-refresh.mjs
          SITE_URL=http://localhost:3016 node apps/www/scripts/interface-preview-e2e.mjs
      - name: axe, keyboard, and phone checks over the export
        run: pnpm --filter www e2e
      - name: Reference app fixture and recovery browser checks
        env:
          AI_REFERENCE_MODE: fixture
          OPENAI_API_KEY: ""
          AI_REFERENCE_BASE: http://localhost:3211
          AI_REFERENCE_ARTIFACTS: ${{ runner.temp }}/vlak-assistant-e2e
          AI_REFERENCE_RECOVERY_ARTIFACTS: ${{ runner.temp }}/vlak-assistant-recovery-e2e
        run: |
          umask 077
          AI_REFERENCE_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/vlak-assistant-data.XXXXXX")"
          export AI_REFERENCE_DATA_DIR
          (
            cd apps/assistant
            exec node node_modules/next/dist/bin/next start -p 3211
          ) > "$RUNNER_TEMP/vlak-assistant-server.log" 2>&1 &
          ASSISTANT_SERVER_PID=$!
          cleanup_assistant() {
            kill "$ASSISTANT_SERVER_PID" 2>/dev/null || true
            wait "$ASSISTANT_SERVER_PID" 2>/dev/null || true
            rm -rf "$AI_REFERENCE_DATA_DIR"
          }
          trap cleanup_assistant EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 60 --max-time 5 -fsS "$AI_REFERENCE_BASE/" > /dev/null
          pnpm --filter @noorddev/vlak-assistant-reference e2e
          pnpm --filter @noorddev/vlak-assistant-reference test:recovery
      - name: Reference app reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-reference
          path: |
            ${{ runner.temp }}/vlak-assistant-e2e
            ${{ runner.temp }}/vlak-assistant-recovery-e2e
            ${{ runner.temp }}/vlak-assistant-server.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: apps/www/out
          retention-days: 7
